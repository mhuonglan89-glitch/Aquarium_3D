        let currentIndex = 0;

        function renderSlide() {
            const slide = slides[currentIndex];
            document.getElementById('slideCounter').innerText = `${currentIndex + 1} / ${slides.length}`;
            document.getElementById('notesContent').innerText = slide.notes;

            let visualHtml = '';
            if (slide.img1 && slide.img2) {
                visualHtml = `
                    <div class="flex flex-col space-y-3 h-full justify-center">
                        <div class="light-card rounded-xl p-2.5 flex flex-col items-center">
                            <img src="${slide.img1}" class="rounded-lg max-h-[195px] w-auto object-contain border border-slate-200 shadow-sm">
                            <p class="text-[11.5px] text-sky-700 font-bold mt-1.5 text-center">${slide.caption1}</p>
                        </div>
                        <div class="light-card rounded-xl p-2.5 flex flex-col items-center">
                            <img src="${slide.img2}" class="rounded-lg max-h-[195px] w-auto object-contain border border-slate-200 shadow-sm">
                            <p class="text-[11.5px] text-sky-700 font-bold mt-1.5 text-center">${slide.caption2}</p>
                        </div>
                    </div>
                `;
            } else if (slide.img1) {
                visualHtml = `
                    <div class="light-card rounded-xl p-3 flex flex-col items-center justify-center h-full">
                        <img src="${slide.img1}" class="rounded-lg max-h-[410px] w-auto object-contain border border-slate-200 shadow-md">
                        <p class="text-xs text-sky-700 font-bold mt-2 text-center">${slide.caption1}</p>
                    </div>
                `;
            }

            document.getElementById('slideContainer').innerHTML = `
                <div class="w-full max-w-7xl h-full flex flex-col justify-between py-1">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-widest text-sky-600">${slide.category}</span>
                            <h2 class="text-2xl lg:text-3xl font-extrabold text-slate-900 mt-0.5">${slide.title}</h2>
                        </div>
                        <span class="px-4 py-1.5 rounded-full text-xs font-bold shadow-sm ${slide.badgeColor}">
                            ${slide.presenter}
                        </span>
                    </div>

                    <div class="grid grid-cols-12 gap-5 flex-1 items-stretch overflow-hidden">
                        <!-- Left: Bullet points (7 cols) -->
                        <div class="col-span-7 light-card rounded-2xl p-6 flex flex-col justify-center overflow-y-auto">
                            <h3 class="text-base font-extrabold text-sky-800 mb-3 flex items-center space-x-2">
                                <span class="text-sky-600 text-lg">✦</span><span>Trọng tâm Nội dung & Kỹ thuật ĐHMT</span>
                            </h3>
                            <ul class="space-y-3.5 text-slate-800">
                                ${slide.items.map(item => `<li class="flex items-start space-x-3"><span class="text-sky-600 font-bold text-lg leading-none mt-0.5">•</span><span class="leading-relaxed text-[14.5px] font-medium">${item}</span></li>`).join('')}
                            </ul>
                        </div>

                        <!-- Right: Visual Media (5 cols) -->
                        <div class="col-span-5 h-full overflow-hidden">
                            ${visualHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide();
            }
        }

        function nextSlide() {
            if (currentIndex < slides.length - 1) {
                currentIndex++;
                renderSlide();
            }
        }

        function toggleNotes() {
            const p = document.getElementById('notesPanel');
            p.classList.toggle('hidden');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key.toLowerCase() === 'n') {
                toggleNotes();
            }
        });

        renderSlide();
    </script>
